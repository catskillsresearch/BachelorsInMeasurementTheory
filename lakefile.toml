name = "BSinMeasurementTheory"
version = "0.1.0"
keywords = ["measurement-theory", "scott-1964", "lean4"]
defaultTargets = ["BSinMeasurementTheory"]

moreLeanArgs = [
  "-Dbackward.privateInPublic=true",
  "-Dbackward.privateInPublic.warn=false",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "BSinMeasurementTheory"
globs = ["BSinMeasurementTheory", "BSinMeasurementTheory.+", "BSinMeasurementTheory.+.+"]
